;[env:esp32-s3-devkitc-1]
;platform = espressif32
;board = esp32-s3-devkitc-1
;framework = arduino
;
;; Match the physical 4MB flash size of the ESP32-S3-Zero
;board_upload.flash_size = 4MB
;board_upload.maximum_size = 4194304
;board_build.flash_mode = dio
;
;; Use the standard 4MB flash partition table layout
;board_build.partitions = default.csv
;
;board_build.filesystem = littlefs
;
;; Fixes boot loop crashes on some S3-Zero modules by disabling PSRAM variables if not mapped
;build_flags =
;    -DARDUINO_USB_CDC_ON_BOOT=1
;    -DARDUINO_USB_MODE=1
;
;monitor_speed = 115200
;
;lib_deps = links2004/WebSockets@^2.7.3

[env:esp32c3_supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; Match the physical 4MB flash size of the ESP32-S3-Zero
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.flash_mode = dio

; Use the standard 4MB flash partition table layout
board_build.partitions = huge_app.csv

board_build.filesystem = littlefs

; Fixes boot loop crashes on some S3-Zero modules by disabling PSRAM variables if not mapped
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

monitor_speed = 115200

lib_deps =
    links2004/WebSockets@^2.7.3
    bblanchon/ArduinoJson